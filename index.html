<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#06110f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://tldrrrnwbmgbfnxyomwn.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'; img-src 'none'; font-src 'none'">
  <title>TOLVANO — Workforce Command Center</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true">T</div>
        <div><strong>TOLVANO</strong><small>Workforce Command Center</small></div>
      </div>
      <div class="actions">
        <button id="localeBtn" class="btn" type="button">EN</button>
        <span id="readChip" class="chip">قراءة فقط</span>
      </div>
    </header>

    <div id="notice" class="notice hidden" aria-live="polite"></div>

    <main id="loginView" class="loginwrap">
      <section class="login" aria-labelledby="loginTitle">
        <h1 id="loginTitle">TOLVANO Command Center</h1>
        <p id="loginDesc"></p>
        <form id="authForm">
          <div class="field">
            <label id="emailLabel" for="email">البريد الإلكتروني</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label id="passwordLabel" for="password">كلمة المرور</label>
            <input id="password" name="password" type="password" minlength="12" autocomplete="current-password" required>
          </div>
          <div class="login-actions">
            <button id="loginBtn" class="btn primary" type="submit">دخول</button>
            <button id="createBtn" class="btn" type="button">إنشاء حساب خاص</button>
          </div>
        </form>
      </section>
    </main>

    <main id="appView" class="hidden">
      <div class="toolbar">
        <button id="refreshBtn" class="btn" type="button">تحديث</button>
        <button id="logoutBtn" class="btn danger" type="button">تسجيل الخروج</button>
      </div>
      <nav id="nav" class="nav" aria-label="TOLVANO Workforce Command Center"></nav>
      <section class="hero">
        <h1 id="heroTitle"></h1>
        <p id="heroDesc"></p>
        <span id="heroState" class="state"></span>
      </section>
      <div id="view"></div>
      <div id="generated" class="footer"></div>
    </main>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
